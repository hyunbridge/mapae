[package]
name = "mapae"
version = "1.0.0"
edition = "2021"
rust-version = "1.95"
description = "Mobile Authentication Platform via Automated Email"
license = "MIT"
keywords = ["authentication", "email", "smtp", "mobile"]
categories = ["authentication"]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false
debug = false

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3

[dependencies]
warp = { version = "0.4.3", default-features = false }
hyper = { version = "1.9", default-features = false, features = ["server", "http1"] }
tokio = { version = "1.43", default-features = false, features = ["macros", "rt-multi-thread", "net", "time", "signal", "sync", "io-util"] }
tokio-util = { version = "0.7.12", default-features = false, features = ["io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
redis = { version = "1.2", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
envy = "0.4.2"
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "zeroize", "pkcs8", "pem"] }
base64 = "0.22.1"
getrandom = "0.4.2"
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }
tracing = { version = "0.1.41", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }
quoted_printable = "0.5.2"
mail-auth = { version = "0.9.0", default-features = false, features = ["ring"] }
moka = { version = "0.12.15", features = ["sync"] }
time = { version = "0.3.37", features = ["formatting", "macros"] }
hyper-util = { version = "0.1.20", features = ["tokio", "service"] }
tokio-io-timeout = "1.2.1"
anyhow = "1.0.102"
thiserror = "2.0.18"
percent-encoding = { version = "2.3", default-features = false, features = ["alloc"] }
